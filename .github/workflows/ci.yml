name: ci
on: [push, pull_request]
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd cloud && npm install --no-audit --no-fund && npx tsc --noEmit && npx vitest run
      - run: node --test scripts/setup.test.mjs
      - run: cd web && npm install --no-audit --no-fund && npm run build
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r desktop/requirements.txt
      - run: cd web && npm install --no-audit --no-fund && npm run build
      - run: cd cloud && npm install --no-audit --no-fund
      - run: cd desktop && QT_QPA_PLATFORM=offscreen python -m pytest tests -q
      - run: QT_QPA_PLATFORM=offscreen python -m pytest tests -q   # end-to-end: local Worker + agent core + simulated boards
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r desktop/requirements.txt
      - run: cd desktop && python -m pytest tests/test_manifest.py tests/test_hardware.py tests/test_toolinstall.py -q
      - name: Build app (PyInstaller)
        run: cd desktop && python build.py
      - name: Largest files in the bundle
        shell: pwsh
        run: Get-ChildItem desktop\dist\MCUBridge -Recurse -File | Sort-Object Length -Descending | Select-Object -First 15 @{n='MB';e={[math]::Round($_.Length/1MB,1)}}, FullName | Format-Table -AutoSize
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=0.1.0" desktop\installer\mcubridge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $i = Get-Item desktop\dist\MCUBridge-Setup.exe
          "Installer: {0:N1} MB" -f ($i.Length/1MB)
      - name: Silent install
        timeout-minutes: 6
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\mcub-install"
          $p = Start-Process desktop\dist\MCUBridge-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/LOG=$env:RUNNER_TEMP\setup.log","/TASKS=" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "installer hung" }
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "installer failed" }
          if (-not (Test-Path "$dir\MCUBridge.exe")) { throw "MCUBridge.exe not installed" }
          "Installed size: {0:N1} MB" -f ((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum/1MB)
      - name: Self-test the installed app (offscreen UI, all pages)
        timeout-minutes: 4
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\mcub-install"
          $env:MCUB_SELFTEST_OUT = "$env:RUNNER_TEMP\selftest.json"
          $env:MCUB_SELFTEST_SHOTS = "$env:RUNNER_TEMP\shots"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $r = Start-Process "$dir\MCUBridge.exe" -ArgumentList "--selftest" -PassThru
          $done = $r.WaitForExit(90000)
          "wall clock: $([int]$sw.ElapsedMilliseconds) ms"
          if (Test-Path "$env:MCUB_SELFTEST_OUT.stages") { "--- stages ---"; Get-Content "$env:MCUB_SELFTEST_OUT.stages" }
          if (-not $done) { $r.Kill(); throw "selftest hung (see stages above)" }
          "exit code: $($r.ExitCode)"
          if ($r.ExitCode -ne 0 -or -not (Test-Path $env:MCUB_SELFTEST_OUT)) { throw "selftest failed" }
          Get-Content $env:MCUB_SELFTEST_OUT
          $j = Get-Content $env:MCUB_SELFTEST_OUT | ConvertFrom-Json
          if (-not $j.ok) { throw "selftest reported failure" }
          Copy-Item "$env:RUNNER_TEMP\shots" desktop\dist\shots -Recurse -ErrorAction SilentlyContinue
      - name: Uninstall
        timeout-minutes: 4
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\mcub-install"
          $u = Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
          $p = Start-Process $u.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "uninstaller hung" }
          Start-Sleep 3
          if (Test-Path "$dir\MCUBridge.exe") { throw "uninstall left files behind" }
          "uninstalled cleanly"
      - uses: actions/upload-artifact@v4
        with:
          name: MCUBridge-windows
          path: |
            desktop/dist/MCUBridge-Setup.exe
            desktop/dist/MCUBridge-win64.zip
            desktop/dist/shots
      - name: Publish release asset (stable direct link)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: MCU Bridge desktop (latest build)
          body: Windows installer + portable zip built from commit ${{ github.sha }}. Unsigned; SmartScreen may warn.
          files: |
            desktop/dist/MCUBridge-Setup.exe
            desktop/dist/MCUBridge-win64.zip

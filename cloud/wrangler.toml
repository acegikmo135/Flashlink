# MCU Bridge — Cloudflare Worker configuration.
# `scripts/setup.mjs` fills in the D1 database_id after creating the database.
name = "mcu-bridge"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Optional custom domain: `node scripts/setup.mjs --domain mcub.example.com` adds a `routes` entry here (the zone must be on your Cloudflare account).

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
# Fallback for /download/MCUBridge-Setup.exe until you publish an installer to the edge (scripts/publish-installer.mjs).
INSTALLER_URL = "https://github.com/acegikmo135/Flashlink/releases/download/desktop-latest/MCUBridge-Setup.exe"

# Invite requests & admin dashboard (docs/setup.md → "Invite requests and the admin dashboard"):
#   ADMIN_EMAIL (var or secret) = your account's email → you get the Admin page and the request emails.
#   MAIL_FROM   (var)           = "MCU Bridge <invite@your-domain>".
# Mail transport — pick ONE:
#   A) Resend:                   wrangler secret put RESEND_API_KEY
#   B) Cloudflare Email Routing: uncomment the binding below (the destination must be a verified Email Routing address).
# [[send_email]]
# name = "SEND_EMAIL"
# destination_address = "you@example.com"

# Optional firmware cache (identical builds and re-flashes skip the slow cloud compile; kept FIRMWARE_CACHE_DAYS, default 7):
#   npx wrangler kv namespace create FIRMWARE_CACHE   → paste the id below and uncomment. Without it the cache is simply off.
# [[kv_namespaces]]
# binding = "FIRMWARE_CACHE"
# id = "<kv-namespace-id>"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "USER_HUB"
class_name = "UserHub"

[[durable_objects.bindings]]
name = "TRANSFER_RELAY"
class_name = "TransferRelay"

# SQLite-backed Durable Objects (available on the Workers Free plan).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserHub", "TransferRelay"]

[[d1_databases]]
binding = "DB"
database_name = "mcu-bridge"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
